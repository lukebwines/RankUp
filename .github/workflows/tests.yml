name: Tests RankUp
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r rankup/app/requirements.txt pytest httpx
      - run: python -m pip check
      - run: PYTHONPATH=rankup/app pytest -q tests/
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import pathlib
          import subprocess
          from tempfile import TemporaryDirectory
          html=pathlib.Path("rankup/app/static/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,flags=re.S|re.I)
          assert scripts, "No inline scripts to check"
          with TemporaryDirectory() as folder:
              for i,script in enumerate(scripts):
                  path=pathlib.Path(folder)/("script-"+str(i)+".js")
                  path.write_text(script,encoding="utf-8")
                  subprocess.run(["node","--check",str(path)],check=True)
          PY

  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crea ZIP sorgenti dai file versionati
        run: git archive --format=zip --prefix=RankUp-source/ -o "$RUNNER_TEMP/RankUp-source.zip" HEAD
      - name: Verifica integrita e portabilita ZIP
        run: python scripts/verify_source_zip.py "$RUNNER_TEMP/RankUp-source.zip"
      - name: Pubblica ZIP sorgenti verificato come artifact della CI
        uses: actions/upload-artifact@v4
        with:
          name: RankUp-source-verified
          path: ${{ runner.temp }}/RankUp-source.zip
          if-no-files-found: error
