name: Tests RankUp
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r rankup/app/requirements.txt pytest httpx
      - run: PYTHONPATH=rankup/app pytest -q tests/
