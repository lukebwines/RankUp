name: RankUp
slug: rankup
description: Gestione candidature e graduatorie per bandi di docenza
version: "0.9.22"
url: https://github.com/lukebwines/RankUp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8095]/api/health"
init: false
ingress: true
ingress_port: 8095
panel_icon: mdi:podium
panel_title: RankUp
ports:
  8095/tcp:
ports_description:
  8095/tcp: Accesso diretto per Cloudflare Tunnel (configurare porta host nella sezione Rete)
options:
  admin_username: admin
  ollama_url: ""
  ollama_keep_alive: "30s"
schema:
  admin_username: str(3,50)
  admin_password: password(12,128)
  ollama_url: str?
  ollama_keep_alive: str?
stage: experimental
