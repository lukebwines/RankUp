name: RankUp
slug: rankup
description: Gestione candidature e graduatorie per bandi di docenza
version: "1.0.29"
url: https://github.com/lukebwines/RankUp
arch:
  - aarch64
  - amd64
startup: application
boot: auto
watchdog: "http://[HOST]:[PORT:8095]/api/health"
init: false
ingress: true
